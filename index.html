<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
    <meta name="theme-color" content="#1d2a1f" />
    <link rel="icon" href="/icons/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />
    <title>%APP_TITLE%</title>
    <style>
      html, body { margin: 0; height: 100%; background: #1d2a1f; overflow: hidden; overscroll-behavior: none; }
      body { font-family: system-ui, sans-serif; color: #f1ead6; -webkit-tap-highlight-color: transparent; touch-action: manipulation; user-select: none; }
      #stage { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
      #ui { position: fixed; inset: 0; pointer-events: none; }
      .bar { position: absolute; left: 0; right: 0; padding: 8px 14px; box-sizing: border-box; }
      .btn { pointer-events: auto; min-height: 52px; font: 600 17px system-ui, sans-serif; border: 0; border-radius: 12px; background: #d9a441; color: #1d2a1f;
             display: flex; align-items: center; justify-content: center; gap: 10px; padding: 6px 14px; }
      .btn:disabled { background: #56604f; color: #1d2a1f; opacity: 0.7; }
      .btn.quiet { background: #34453a; color: #f1ead6; }
      .btn.active { outline: 3px solid #fff; }
      .step { pointer-events: auto; width: 44px; height: 44px; border: 0; border-radius: 10px; background: #3d4f43; color: #f1ead6; font: 600 22px system-ui, sans-serif; }
      .sheet { pointer-events: auto; position: absolute; left: 0; right: 0; bottom: 0; background: #1a241c; border-radius: 16px 16px 0 0; box-shadow: 0 -6px 24px rgba(0,0,0,0.5);
               padding: 14px 14px calc(16px + env(safe-area-inset-bottom)); box-sizing: border-box; max-height: 70%; overflow-y: auto; }
      .panel { pointer-events: auto; position: absolute; left: 12px; right: 12px; top: 50%; transform: translateY(-50%); background: #1a241c; border-radius: 16px;
               box-shadow: 0 6px 30px rgba(0,0,0,0.6); padding: 18px 16px; box-sizing: border-box; max-height: 86%; overflow-y: auto; }
      .banner { position: absolute; left: 0; right: 0; top: 38%; text-align: center; font-size: 32px; font-weight: 700; text-shadow: 0 2px 8px #000; padding: 0 16px; animation: pop 400ms ease-out; }
      @keyframes pulse { 0%, 100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(255,255,255,0.7); } 50% { transform: scale(1.03); box-shadow: 0 0 0 10px rgba(255,255,255,0); } }
      .pulse { animation: pulse 1s infinite; }
      @keyframes pop { 0% { transform: scale(0.6); opacity: 0; } 20% { transform: scale(1.1); opacity: 1; } 100% { transform: scale(1); opacity: 1; } }
    </style>
  </head>
  <body>
    <canvas id="stage"></canvas>
    <div id="ui"></div>
    <script type="module" src="/src/app/main.tsx"></script>
  </body>
</html>

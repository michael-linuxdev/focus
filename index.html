<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
    <meta name="theme-color" content="#1d2a1f" />
    <link rel="icon" href="/icons/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />
    <title>%APP_TITLE%</title>
    <style>
      html, body { margin: 0; height: 100%; background: #1d2a1f; overflow: hidden; overscroll-behavior: none; }
      body { font-family: system-ui, sans-serif; color: #f1ead6; -webkit-tap-highlight-color: transparent; touch-action: manipulation; user-select: none; }
      #stage { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
      #ui { position: fixed; inset: 0; pointer-events: none; }
    </style>
  </head>
  <body>
    <canvas id="stage"></canvas>
    <div id="ui"></div>
    <script type="module" src="/src/app/main.tsx"></script>
  </body>
</html>

name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  schedule:
    # Täglich frische Daten holen und neu veröffentlichen (05:17 UTC).
    - cron: "17 5 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: Node.js einrichten
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Abhängigkeiten installieren
        run: npm ci

      - name: Tests
        run: npm test

      - name: Daten aktualisieren
        # Scheitert der Abruf, wird der im Repository liegende Stand veröffentlicht.
        run: npm run data || echo "::warning::Datenabruf fehlgeschlagen, veröffentliche den eingecheckten Stand."

      - name: Bauen
        run: npm run build

      - name: Seiten-Artefakt hochladen
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Auf GitHub Pages veröffentlichen
        id: deployment
        uses: actions/deploy-pages@v4

name: GENESIS-Zugang prüfen

# Nur von Hand auszulösen. Zeigt im Protokoll, was das Konto liefert; verändert nichts.
on:
  workflow_dispatch:
    inputs:
      tables:
        description: Tabellencodes, durch Leerzeichen getrennt (leer = Standardauswahl)
        required: false
        default: ""
      source:
        description: destatis (GENESIS-Online) oder regional (Regionaldatenbank)
        required: false
        default: destatis
      guest:
        description: Mit dem Gastzugang statt mit dem Token prüfen
        type: boolean
        default: false
      refresh:
        description: Stattdessen alle Daten neu holen und auf diesen Branch committen (nicht auf main)
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Abrufe testen
        if: ${{ !inputs.refresh }}
        env:
          GENESIS_USER: ${{ secrets.GENESIS_USER }}
          GENESIS_PASSWORD: ${{ secrets.GENESIS_PASSWORD }}
          REGIONAL_USER: ${{ secrets.REGIONAL_USER }}
          REGIONAL_PASSWORD: ${{ secrets.REGIONAL_PASSWORD }}
          TABLES: ${{ inputs.tables }}
          PROBE_SOURCE: ${{ inputs.source }}
          PROBE_GUEST: ${{ inputs.guest }}
        run: node scripts/genesis-probe.ts $TABLES
      - name: Daten neu holen und committen
        if: ${{ inputs.refresh && github.ref != 'refs/heads/main' }}
        env:
          GENESIS_USER: ${{ secrets.GENESIS_USER }}
          GENESIS_PASSWORD: ${{ secrets.GENESIS_PASSWORD }}
        run: |
          node scripts/fetch-data.ts
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data
          git commit -m "Datenstand aktualisiert" || echo "Keine Änderung"
          git push
